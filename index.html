<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BladeStats</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --surface-muted: #eef2f7;
    --ink: #171a1f;
    --muted: #667085;
    --line: #d8dee8;
    --accent: #0f766e;
    --accent-dark: #115e59;
    --gold: #b7791f;
    --silver: #6b7280;
    --bronze: #a45f2b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--ink);
  }

  .header {
    padding: 2rem 1.25rem 1.4rem;
    background: #171a1f;
    border-bottom: 4px solid var(--accent);
    color: #fff;
  }

  .header h1 {
    max-width: 1200px;
    margin: 0 auto;
    font-size: 2.1rem;
    font-weight: 700;
    margin-bottom: 0.25rem;
    letter-spacing: 0;
  }

  .header p {
    max-width: 1200px;
    margin: 0 auto;
    color: #cbd5e1;
    font-size: 0.95rem;
    font-weight: 400;
  }

  .tabs {
    display: flex;
    justify-content: flex-start;
    gap: 0.5rem;
    max-width: 1200px;
    margin: 1.25rem auto 0.75rem;
    padding: 0 1rem;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 0.55rem 1rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  }

  .tab-btn:hover {
    background: var(--surface-muted);
    border-color: #b8c2d1;
  }

  .tab-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .filters {
    display: flex;
    justify-content: flex-start;
    gap: 0.5rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 1rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: 0.45rem 0.8rem;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .filter-btn:hover {
    background: var(--surface-muted);
    color: var(--ink);
  }

  .filter-btn.active {
    background: #e7f5f2;
    color: var(--accent-dark);
    border-color: #8fd4c9;
  }

  .search-bar {
    display: flex;
    justify-content: flex-start;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 1rem;
  }

  .search-bar input {
    width: 100%;
    max-width: 440px;
    padding: 0.6rem 1.2rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85rem;
    outline: none;
    color: var(--ink);
    background: var(--surface);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-bar input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.14);
  }

  .search-bar input::placeholder { color: #98a2b3; }

  .stats-summary {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 0.75rem;
    font-size: 0.8rem;
    color: var(--muted);
    font-weight: 500;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1rem 2rem;
  }

  .skater-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 1.2rem;
    margin-bottom: 0.8rem;
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
    border: 1px solid var(--line);
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .skater-card:hover {
    border-color: #b8c2d1;
    box-shadow: 0 8px 20px rgba(16, 24, 40, 0.08);
  }

  .skater-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.8rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .skater-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #e7f5f2;
    color: var(--accent-dark);
    font-size: 0.8rem;
    font-weight: 700;
    flex-shrink: 0;
    margin-right: 0.8rem;
  }

  .skater-rank.gold { background: #fff7df; color: var(--gold); }
  .skater-rank.silver { background: #edf0f5; color: var(--silver); }
  .skater-rank.bronze { background: #fff0e4; color: var(--bronze); }

  .skater-info { flex: 1; }

  .skater-name {
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--ink);
  }

  .skater-details {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }

  .skater-details span {
    display: inline-block;
    margin-right: 0.8rem;
  }

  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 600;
    color: white;
  }

  .badge-jr-a { background: #155e75; }
  .badge-jr-b { background: #7c3aed; }
  .badge-jr-c { background: #be123c; }
  .badge-jr-d { background: #b7791f; }
  .badge-jr-e { background: #15803d; }
  .badge-jr-f { background: #475569; }
  .badge-jr-g { background: #334155; }
  .badge-senior { background: #4b5563; }

  .times-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 0.5rem;
  }

  .time-item {
    background: #f8fafc;
    border-radius: 8px;
    padding: 0.5rem 0.7rem;
    text-align: center;
    border: 1px solid #e5eaf1;
  }

  .time-distance {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
  }

  .time-value {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
    margin-top: 0.1rem;
    font-variant-numeric: tabular-nums;
  }

  .no-results {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--muted);
    font-size: 1.1rem;
  }

  .footer {
    text-align: center;
    padding: 1.5rem;
    color: var(--muted);
    font-size: 0.75rem;
  }

  .footer a { color: var(--accent-dark); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  @media (max-width: 600px) {
    .header h1 { font-size: 1.4rem; }
    .skater-name { font-size: 0.95rem; }
    .times-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>BladeStats</h1>
  <p>U.S. junior short track personal bests, updated with 2026 Age Class Nationals</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('girls')">Girls</button>
  <button class="tab-btn" onclick="switchTab('boys')">Boys</button>
  <button class="tab-btn" onclick="switchTab('all')">All</button>
</div>

<div class="filters" id="divisionFilters">
  <button class="filter-btn active" onclick="filterDivision('all')">All Divisions</button>
  <button class="filter-btn" onclick="filterDivision('Junior A')">Junior A</button>
  <button class="filter-btn" onclick="filterDivision('Junior B')">Junior B</button>
  <button class="filter-btn" onclick="filterDivision('Junior C')">Junior C</button>
  <button class="filter-btn" onclick="filterDivision('Junior D')">Junior D</button>
  <button class="filter-btn" onclick="filterDivision('Junior E')">Junior E</button>
  <button class="filter-btn" onclick="filterDivision('Junior F')">Junior F</button>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search by name, team, or division" oninput="renderCards()">
</div>

<div class="stats-summary" id="statsSummary"></div>

<div class="container" id="cardContainer"></div>

<div class="footer">
  Data from <a href="https://www.shorttracklive.info/" target="_blank">shorttracklive.info</a> · 
  Last updated: <span id="lastUpdated"></span> · 
  Made with OliviaAgent
</div>

let currentTab = 'girls';
let currentDivision = 'all';

function getBadgeClass(cat) {
  if (cat.includes('Junior A')) return 'badge-jr-a';
  if (cat.includes('Junior B')) return 'badge-jr-b';
  if (cat.includes('Junior C')) return 'badge-jr-c';
  if (cat.includes('Junior D')) return 'badge-jr-d';
  if (cat.includes('Junior E')) return 'badge-jr-e';
  if (cat.includes('Junior F')) return 'badge-jr-f';
  if (cat.includes('Junior G')) return 'badge-jr-g';
  if (cat.includes('Senior')) return 'badge-senior';
  return 'badge-jr-c';
}

function parseTime(t) {
  if (!t) return Infinity;
  const s = String(t);
  if (s.includes(':')) {
    const parts = s.split(':');
    return parseFloat(parts[0]) * 60 + parseFloat(parts[1]);
  }
  return parseFloat(s);
}

const distOrder = ['107m','214m','222m','260m','321m','333m','383m','400m','428m','500m','595m','777m','1000m','1500m','3000m'];

function sortDists(pbs) {
  return Object.entries(pbs).sort((a, b) => {
    const ai = distOrder.indexOf(a[0]);
    const bi = distOrder.indexOf(b[0]);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
}

function getFiltered() {
  let list = SKATERS;

  // Filter by gender tab
  if (currentTab === 'girls') list = list.filter(s => s.gender === 'F');
  else if (currentTab === 'boys') list = list.filter(s => s.gender === 'M');

  // Filter by division
  if (currentDivision !== 'all') {
    list = list.filter(s => s.age_category === currentDivision);
  }

  // Filter by search
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (q) {
    list = list.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.club || '').toLowerCase().includes(q) ||
      s.age_category.toLowerCase().includes(q)
    );
  }

  // Sort by 500m PB
  list.sort((a, b) => parseTime(a.pbs['500m']) - parseTime(b.pbs['500m']));

  return list;
}

function renderCards() {
  const list = getFiltered();
  const container = document.getElementById('cardContainer');
  const summary = document.getElementById('statsSummary');

  if (list.length === 0) {
    container.innerHTML = '<div class="no-results">No skaters found</div>';
    summary.textContent = '';
    return;
  }

  summary.textContent = `Showing ${list.length} skater${list.length !== 1 ? 's' : ''}`;

  container.innerHTML = list.map((s, i) => {
    const rank = i + 1;
    let rankClass = '';
    if (rank === 1) rankClass = 'gold';
    else if (rank === 2) rankClass = 'silver';
    else if (rank === 3) rankClass = 'bronze';

    const sortedPbs = sortDists(s.pbs);
    const timesHTML = sortedPbs.map(([dist, time]) => `
      <div class="time-item">
        <div class="time-distance">${dist}</div>
        <div class="time-value">${time}</div>
      </div>
    `).join('');

    return `
      <div class="skater-card">
        <div class="skater-top">
          <div style="display:flex;align-items:center;">
            <div class="skater-rank ${rankClass}">${rank}</div>
            <div class="skater-info">
              <div class="skater-name">${formatName(s.name)}</div>
              <div class="skater-details">
                <span>Age: ${s.age}</span>
                <span>Team: ${s.club}</span>
              </div>
            </div>
          </div>
          <span class="badge ${getBadgeClass(s.age_category)}">${s.age_category}</span>
        </div>
        <div class="times-grid">${timesHTML}</div>
      </div>
    `;
  }).join('');
}

function formatName(name) {
  return name.replace(/\s+/g, ' ').trim().split(' ').map(w =>
    w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()
  ).join(' ');
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

function filterDivision(div) {
  currentDivision = div;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

document.getElementById('lastUpdated').textContent = new Date().toLocaleDateString('en-US', {
  year: 'numeric', month: 'long', day: 'numeric'
});

renderCards();
</script>
